    <script>
      // Apply the saved theme before paint to avoid a flash. Movement's
      // "Daylight" identity is light-first, so light is the default; a saved
      // choice (either way) always wins.
      (function () {
        try {
          var t = localStorage.getItem('movement.theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
