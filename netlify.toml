# Netlify deploy config.  Deploy with:  npx netlify-cli deploy --prod
[build]
  command = "npm run build"
  publish = "dist"

# The app uses HashRouter, so deep links resolve client-side; this catch-all
# just guarantees a direct hit on any path still serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable; the service worker must never be stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
